# Nginx load balancer for distributed prediction workers
# Routes prediction requests to multiple worker instances

upstream prediction_backend {
    # Load balancing method: least connections (best for variable request times)
    least_conn;
    
    # Prediction worker instances
    server prediction-worker-0:8080 max_fails=3 fail_timeout=30s;
    server prediction-worker-1:8081 max_fails=3 fail_timeout=30s;
    server prediction-worker-2:8082 max_fails=3 fail_timeout=30s;
    server prediction-worker-3:8083 max_fails=3 fail_timeout=30s;
    server prediction-worker-4:8084 max_fails=3 fail_timeout=30s;
    server prediction-worker-5:8085 max_fails=3 fail_timeout=30s;
    server prediction-worker-6:8086 max_fails=3 fail_timeout=30s;
    server prediction-worker-7:8087 max_fails=3 fail_timeout=30s;
    
    # Keep connections alive for better performance
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    
    # Logging
    access_log /var/log/nginx/prediction_access.log;
    error_log /var/log/nginx/prediction_error.log;
    
    # Client body size limit (10MB for images)
    client_max_body_size 10M;
    
    # Timeouts optimized for fast prediction
    client_body_timeout 2s;
    client_header_timeout 1s;
    keepalive_timeout 2s;
    send_timeout 2s;
    
    # Prediction endpoint
    location /predict {
        proxy_pass http://prediction_backend;
        
        # Proxy timeouts (aggressive for fast failover)
        proxy_connect_timeout 1s;
        proxy_send_timeout 2s;
        proxy_read_timeout 2s;
        
        # Buffering settings
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # HTTP version
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    
    # Health check endpoint
    location /health {
        proxy_pass http://prediction_backend/health;
        proxy_connect_timeout 1s;
        proxy_send_timeout 1s;
        proxy_read_timeout 1s;
    }
    
    # Root endpoint (status)
    location / {
        return 200 '{"status":"ok","service":"prediction-load-balancer"}';
        add_header Content-Type application/json;
    }
}
