version: '3.8'

services:
  # Nginx load balancer
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - prediction-worker-0
      - prediction-worker-1
      - prediction-worker-2
      - prediction-worker-3
      - prediction-worker-4
      - prediction-worker-5
      - prediction-worker-6
      - prediction-worker-7
    restart: unless-stopped
    networks:
      - prediction-network

  # Prediction worker 0
  prediction-worker-0:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - WORKER_ID=0
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
    networks:
      - prediction-network

  # Prediction worker 1
  prediction-worker-1:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - WORKER_ID=1
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
    networks:
      - prediction-network

  # Prediction worker 2
  prediction-worker-2:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - WORKER_ID=2
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
    networks:
      - prediction-network

  # Prediction worker 3
  prediction-worker-3:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - WORKER_ID=3
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
    networks:
      - prediction-network

  # Prediction worker 4
  prediction-worker-4:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - WORKER_ID=4
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
    networks:
      - prediction-network

  # Prediction worker 5
  prediction-worker-5:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - WORKER_ID=5
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
    networks:
      - prediction-network

  # Prediction worker 6
  prediction-worker-6:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - WORKER_ID=6
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
    networks:
      - prediction-network

  # Prediction worker 7
  prediction-worker-7:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - WORKER_ID=7
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
    networks:
      - prediction-network

networks:
  prediction-network:
    driver: bridge
